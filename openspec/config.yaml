schema: spec-driven

context: |
  Tech stack: Laravel 11 backend avec Moonshine Admin.
  API RESTful pour un frontend Next.js App Router avec TailwindCSS.
  Domaine : agence de voyage Omra 2026-2027, gestion des séjours, hôtels, dates, tarifs, leads et pages légales.

rules:
  proposal:
    - Garder les résumés sous 400 mots.
    - Présenter l'architecture backend et frontend en français.
    - Le backend et le frontend doivent être découplés et communiquer via l'API RESTful.
    - Utiliser les standards de codage Laravel et Next.js.
    - Utiliser les skills de skills.sh pertinent pour le développement backend et frontend.
  tasks:
    - Générer des artefacts pour les modèles de données, les endpoints API et les pages frontend.
    - Documenter les entités métier et les relations.
